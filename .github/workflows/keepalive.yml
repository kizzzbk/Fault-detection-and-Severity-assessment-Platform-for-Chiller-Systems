# Pings the deployed demo so free hosts (HF Spaces / Render) never go to sleep.
# Set repository variable DEMO_URL, e.g. https://<user>-chiller-twin.hf.space
name: keep-demo-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping healthz
        run: |
          URL="${{ vars.DEMO_URL }}"
          URL="${URL:-https://fault-detection-and-severity-assessment.onrender.com}"
          echo "Pinging ${URL}/healthz ..."
          curl -fsS --retry 3 --max-time 60 "${URL}/healthz"


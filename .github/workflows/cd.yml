name: CD - Build & Push Docker Hub

on:
  push:
    branches: ["main"]          
  workflow_dispatch:             

jobs:
  docker-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
 
      - name: Checkout code
        uses: actions/checkout@v4

 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

 
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

 
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Thay 'kizzzbk' bằng username Docker Hub của bạn nếu khác
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/chiller-fault-detection:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/chiller-fault-detection:${{ github.sha }}

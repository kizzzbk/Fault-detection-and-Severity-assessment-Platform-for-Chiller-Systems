[project]
name = "chiller-fault-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kizzzbk", email = "phananh7105@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=21.0.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "xlrd>=2.0.2",
]

[project.scripts]
chiller-fault-detection = "chiller_fault_detection:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[project]
name = "chiller-fault-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kizzzbk", email = "phananh7105@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "coolprop>=8.0.0",
    "einops>=0.8.2",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=21.0.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "torch>=2.14.0",
    "transformers>=4.56",
    "xlrd>=2.0.2",
]

[project.scripts]
chiller-fault-detection = "chiller_fault_detection:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
demo = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E402", "F403", "E501"]
